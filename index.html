<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rat Maze Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #222;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #maze-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 1000;
        }
        #progress-container {
            width: 80%;
            max-width: 400px;
            height: 20px;
            background-color: #333;
            border-radius: 10px;
            margin-top: 20px;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #4CAF50;
            border-radius: 10px;
            transition: width 0.3s;
        }
        #stats-container {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            color: white;
            font-size: 14px;
        }
        .stat-bar {
            margin: 5px 0;
        }
        .stat-label {
            display: inline-block;
            width: 80px;
        }
        .stat-progress {
            display: inline-block;
            width: 150px;
            height: 10px;
            background-color: #333;
            border-radius: 5px;
            margin-left: 10px;
            position: relative;
        }
        .stat-value {
            height: 100%;
            border-radius: 5px;
            position: absolute;
            top: 0;
            left: 0;
        }
        .energy-value {
            background-color: #f44336;
        }
        .hydration-value {
            background-color: #2196f3;
        }
        .alertness-value {
            background-color: #ffc107;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="maze-canvas"></canvas>
        
        <div id="loading-screen">
            <h2>Generating Rat Maze...</h2>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>
        
        <div id="stats-container">
            <div class="stat-bar">
                <span class="stat-label">Energy:</span>
                <div class="stat-progress">
                    <div id="energy-bar" class="stat-value energy-value" style="width: 100%"></div>
                </div>
            </div>
            <div class="stat-bar">
                <span class="stat-label">Hydration:</span>
                <div class="stat-progress">
                    <div id="hydration-bar" class="stat-value hydration-value" style="width: 100%"></div>
                </div>
            </div>
            <div class="stat-bar">
                <span class="stat-label">Alertness:</span>
                <div class="stat-progress">
                    <div id="alertness-bar" class="stat-value alertness-value" style="width: 50%"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script type="importmap">
    {
        "imports": {
            "@replit/database": "https://cdn.jsdelivr.net/npm/@replit/database@2.0.5/+esm",
            "websim/database": "websim/database.js",
            "websim/multiplayer": "websim/multiplayer.js"
        }
    }
    </script>
    <script src="game.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
